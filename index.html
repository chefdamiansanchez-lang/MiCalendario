<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181A">
<title>Doce Meses — Calendario</title>
<meta name="description" content="Calendario con paisajes reales de cada estación, agenda por día y recordatorios.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Fondo de paisaje del mes -->
  <div class="hero-wrap">
    <div class="hero" id="hero">
      <img id="heroImg" alt="">
      <div class="hero-scrim"></div>
    </div>

    <!-- Encabezado: mes, estación, reloj -->
    <header class="topbar">
      <button class="nav-btn" id="prevMonth" aria-label="Mes anterior">‹</button>
      <div class="month-title">
        <h1 id="monthName">Marzo</h1>
        <p id="seasonName">otoño · 2026</p>
      </div>
      <button class="nav-btn" id="nextMonth" aria-label="Mes siguiente">›</button>
    </header>

    <div class="clock" id="clock">
      <span id="clockTime">00:00</span>
      <span id="clockDate">domingo 1</span>
    </div>
  </div>

  <!-- Grilla del calendario -->
  <main class="calendar-panel">
    <div class="weekday-row">
      <span>lu</span><span>ma</span><span>mi</span><span>ju</span><span>vi</span><span>sá</span><span>do</span>
    </div>
    <div class="day-grid" id="dayGrid"></div>
  </main>

  <button class="today-fab" id="todayBtn" aria-label="Ir a hoy">Hoy</button>
</div>

<!-- Hoja de agenda del día -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <section class="day-sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="sheetDate">1 de marzo</h2>
      <button class="close-btn" id="closeSheet" aria-label="Cerrar">✕</button>
    </div>

    <ul class="entry-list" id="entryList"></ul>
    <p class="empty-msg" id="emptyMsg">Todavía no hay nada anotado este día.</p>

    <form class="entry-form" id="entryForm">
      <input type="text" id="entryText" placeholder="Agregar un evento o nota" maxlength="140" required>
      <div class="form-row">
        <input type="time" id="entryTime" aria-label="Hora del recordatorio">
        <label class="reminder-toggle">
          <input type="checkbox" id="entryReminder">
          <span>Avisarme con alarma</span>
        </label>
      </div>
      <button type="submit" class="save-btn">Guardar</button>
    </form>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
